# Build Flutter web and push to gh-pages branch. GitHub Pages serves from that branch.
# Project URL: https://sumithsb.github.io/personal_portfolio/
# In Settings → Pages set: Source = "Deploy from a branch", Branch = gh-pages, Folder = / (root).
# Custom domain (sumithsb.com): set BASE_HREF to "/" below, then add domain in Settings → Pages.

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  # Use "/personal_portfolio/" for github.io. Use "/" only when using custom domain.
  BASE_HREF: "/personal_portfolio/"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.27.0"
          channel: "stable"
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Build web
        run: flutter build web --release --base-href "${{ env.BASE_HREF }}"

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: build/web
          force_orphan: true
