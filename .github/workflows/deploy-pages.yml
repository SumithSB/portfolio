# Build Flutter web and push to "pages" branch. GitHub Pages serves from that branch.
# Project URL: https://sumithsb.github.io/portfolio/
# Settings → Pages: Source = "Deploy from a branch", Branch = pages, Folder = / (root).

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  BASE_HREF: "/portfolio/"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.27.0"
          channel: "stable"
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Build web
        run: flutter build web --release --base-href "${{ env.BASE_HREF }}"

      - name: Deploy to pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: build/web
          publish_branch: pages
          force_orphan: true
